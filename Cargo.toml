[package]
name = "rsstg"
version = "0.1.15"
authors = ["arcade"]
edition = "2018"

[dependencies]
chrono = "*"
config = "*"
futures = "*"
futures-util = "*"
regex = "*"
rss = { version = "*", features = [ "from_url" ] }
sqlx = { version = "*", features = [ "postgres", "tls", "runtime-tokio-native-tls", "chrono" ] }
telegram-bot = "*"
tokio = { version = "0.2", features = ["macros" ] }

lazy_static = "*"

anyhow = "*"

[profile.release]
lto = true
codegen-units = 1
