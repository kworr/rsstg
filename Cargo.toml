[package]
name = "rsstg"
version = "0.1.6"
authors = ["arcade"]
edition = "2018"

[dependencies]
config = "*"

futures = "*"
telegram-bot = "*"
tokio = { version = "0.2", features = ["macros" ] }

futures-util = "*"

sqlx = { version = "*", features = [ "postgres", "tls", "runtime-async-std-native-tls", "chrono" ] }

regex = "*"

rss = { version = "*", features = [ "from_url" ] }

chrono = "*"

[profile.release]
lto = true
codegen-units = 1
